services:
  gazebo:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        BASE_IMAGE: ${ROVER_BASE_IMAGE:-sverk/ros2:sitl-novnc}
    image: sverk/rover-gz-sandbox:dev
    container_name: small_rover_gz
    environment:
      GZ_SIM_RESOURCE_PATH: /workspace/models
      LIBGL_ALWAYS_SOFTWARE: "1"
      ROVER_MARKER_ENABLED: ${ROVER_MARKER_ENABLED:-true}
      ROVER_MARKER_SIZE: ${ROVER_MARKER_SIZE:-0.08}
      ROVER_MARKER_VOCABULARY: ${ROVER_MARKER_VOCABULARY:-DICT_4X4_1000}
      ROVER_MARKER_ID: ${ROVER_MARKER_ID:-99}
      ROVER_MARKER_X: ${ROVER_MARKER_X:--0.043195}
      ROVER_MARKER_Y: ${ROVER_MARKER_Y:-0.0}
      ROVER_MARKER_Z: ${ROVER_MARKER_Z:-0.153}
      ROVER_MARKER_YAW: ${ROVER_MARKER_YAW:-0.0}
      VNC_RESOLUTION: ${VNC_RESOLUTION:-1920x1080x24}
    ports:
      - "127.0.0.1:6081:6080"
    shm_size: 1gb
    stdin_open: true
    tty: true
    volumes:
      - .:/workspace
